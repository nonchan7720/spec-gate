# confidence: 3/3
# dry-run: pass
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve LEAK-001` を実行する
id: LEAK-001
kind: example
title: コード内に値の表記がそのまま現れた場合のみ、その値を検知して返す（3桁以上の数値・4文字以上の文字列が対象）
source:
    type: markdown
    ref: docs/spec/harness.md#リテラル漏れ検知
binding: go run ./tools/bind leak
examples:
    - in:
        code: if x == 1234.56 { return 1234 }
        values:
            - 1234.56
            - 1234
      out:
        - 1234.56
        - 1234
    - in:
        code: return math.Floor(x)
        values:
            - 1234.56
            - 1234
      out: []
    - in:
        code: return 0
        values:
            - 0
            - 1
      out: []
    - in:
        code: msg := "円未満は切り捨て"
        values:
            - 円未満は切り捨て
            - ok
      out:
        - 円未満は切り捨て
