# confidence: 1/3
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve MUTATION-007-2` を実行する
id: MUTATION-007-2
kind: example
title: '比較の変異: > → >= と <、< → <= と >、>= → >、<= → <、== → !=、!= → =='
source:
    type: markdown
    ref: docs/spec/harness.md#mutation score
binding: go run ./tools/bind mutate
examples:
    - in: x > 0
      out:
        - x >= 0
        - x < 0
    - in: x == y
      out:
        - x != y
