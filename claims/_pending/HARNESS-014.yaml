# confidence: 3/3
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve HARNESS-014` を実行する
id: HARNESS-014
kind: example
title: 作業ディレクトリ内のパスは ref の /・#・空白を _ に置き換えた名前を使い、extract のプロンプトは .spec-gate-llm/extract/<置換後の ref>/run-<k>.prompt.md になる
source:
    type: markdown
    ref: docs/spec/harness.md#LLM 処理のサブエージェント委譲
binding: go run ./tools/bind llm-paths
examples:
    - in: '{"ref": "docs/spec/rounding.md#端数処理", "runs": 2}'
      out: '[".spec-gate-llm/extract/docs_spec_rounding.md_端数処理/run-1.prompt.md", ".spec-gate-llm/extract/docs_spec_rounding.md_端数処理/run-2.prompt.md"]'
    - in: '{"ref": "docs/arch/layers.mmd", "runs": 1}'
      out: '[".spec-gate-llm/extract/docs_arch_layers.mmd/run-1.prompt.md"]'
