# confidence: 1/3
# dry-run: fail: 1 件中 1 件が期待と違う
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve APPROVER-012` を実行する
id: APPROVER-012
kind: example
title: 承認役のコマンドに ; & | などで別のコマンドをつないだものは拒否する
source:
    type: markdown
    ref: docs/spec/auto-approval.md#承認役のエージェント
binding: go run ./tools/bind guard
examples:
    - in:
        agent_type: spec-gate-approver
        command: spec-gate audit; rm -rf claims
        tool: Bash
      out: deny
properties:
    - '!(has(input.agent_type) && input.agent_type == "spec-gate-approver" && input.tool == "Bash" && (input.command.contains(";") || input.command.contains("&") || input.command.contains("|"))) || output == "deny"'
