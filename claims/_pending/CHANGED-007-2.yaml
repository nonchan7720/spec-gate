# confidence: 1/3
# dry-run: error: binding が失敗 (exit status 1): touched: json: cannot unmarshal string into Go value of type struct { Touches []string "jso
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve CHANGED-007-2` を実行する
id: CHANGED-007-2
kind: example
title: touches に依存パッケージのディレクトリが加わっていれば、その配下の変更で claim は対象になる
source:
    type: markdown
    ref: docs/spec/harness.md#変更検知の精度
binding: go run ./tools/bind touched
examples:
    - in: '{"touches": ["tools/bind", "pkg/domain"], "changed": "pkg/domain/relink.go"}'
      out: true
