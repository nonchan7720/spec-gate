# confidence: 3/3
# dry-run: pass
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve FUZZ-008` を実行する
id: FUZZ-008
kind: example
title: relation 式を、x と f の呼び出し結果（values）を与えて評価し真偽を返す
source:
    type: markdown
    ref: docs/spec/harness.md#ランダム入力による検証
binding: go run ./tools/bind relation
examples:
    - in:
        relation: f(x + 1) == f(x) + 1
        values:
            f(x + 1): 2
            f(x): 1
        x: 1.5
      out: true
    - in:
        relation: f(x + 1) == f(x) + 1
        values:
            f(x + 1): 3
            f(x): 1
        x: 1.5
      out: false
