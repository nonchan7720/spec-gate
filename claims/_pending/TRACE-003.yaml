# confidence: 3/3
# dry-run: pass
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve TRACE-003` を実行する
id: TRACE-003
kind: example
title: trace-summary は 1 つの claim の判定履歴（古い順）から、最後の pass の直前の連続 fail 回数とその pass の時点の変更行数を返し、pass していなければ null を返す
source:
    type: markdown
    ref: docs/spec/harness.md#通り方のログ
binding: go run ./tools/bind trace-summary
examples:
    - in:
        - lines: 10
          status: fail
        - lines: 40
          status: fail
        - lines: 120
          status: pass
      out:
        fails_before_pass: 2
        lines_at_pass: 120
    - in:
        - lines: 5
          status: pass
      out:
        fails_before_pass: 0
        lines_at_pass: 5
    - in:
        - lines: 3
          status: fail
      out: null
properties:
    - output == null || (output.fails_before_pass.isInteger() && output.fails_before_pass >= 0)
    - output == null || output.fails_before_pass < size(input)
