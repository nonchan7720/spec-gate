# confidence: 2/3
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve CHANGED-008` を実行する
id: CHANGED-008
kind: example
title: touched は touches と changed から、その claim が対象かどうかを true/false で返す
source:
    type: markdown
    ref: docs/spec/harness.md#変更検知の精度
binding: go run ./tools/bind touched
examples:
    - in: '{"touches": ["src/payroll/round.ts"], "changed": "src/payroll/round.ts"}'
      out: "true"
    - in: '{"touches": ["src/payroll/round.ts"], "changed": "src/payroll/util.ts"}'
      out: "true"
    - in: '{"touches": ["src/payroll/round.ts"], "changed": "src/payroll/README.md"}'
      out: "false"
    - in: '{"touches": ["src/app"], "changed": "src/app/handler/x.ts"}'
      out: "true"
    - in: '{"touches": ["src/payroll/round.ts"], "changed": "src/ui/List.tsx"}'
      out: "false"
    - in: '{"touches": ["tools/bind", "pkg/domain"], "changed": "pkg/domain/relink.go"}'
      out: "true"
