# confidence: 3/3
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve HOLDOUT-014` を実行する
id: HOLDOUT-014
kind: example
title: holdout-summary は holdout の判定結果の配列を、レポートに出す 1 行に要約する
source:
    type: markdown
    ref: docs/spec/harness.md#holdout examples
binding: go run ./tools/bind holdout-summary
examples:
    - in:
        - pass: true
        - pass: true
      out: holdout 2 件すべて一致
    - in:
        - pass: true
        - got: 2
          in: 1.5
          out: 1
          pass: false
      out: holdout 2 件中 1 件が不一致（値は表示しない）
    - in: []
      out: holdout なし
properties:
    - '!output.contains(''1.5'')'
