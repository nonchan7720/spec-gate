id: REMOTE-005
kind: manual
title: review ask の選択肢は「承認」「却下」「曖昧」の 3 つで、各 description に操作の意味を平易に書き、preview に候補の内容（タイトル・仕様の場所・種類・例の表・確かめるコマンドなど）を Markdown で書く。3 つとも同じ preview
source:
