# confidence: 1/3
# dry-run: pass
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve PIN-002-2` を実行する
id: PIN-002-2
kind: example
title: guard はシェル経由（go build -o の出力先・ln・rm など）での固定版の入口と置き場所の書き換えを拒否し、bin/spec-gate.real への go build -o は許可する
source:
    type: markdown
    ref: docs/spec/auto-approval.md#固定版で動かす
binding: go run ./tools/bind guard
examples:
    - in:
        command: go build -o bin/spec-gate .
        tool: Bash
      out: deny
    - in:
        command: go build -o bin/spec-gate.real .
        tool: Bash
      out: allow
    - in:
        command: ln -sf /tmp/x bin/spec-gate
        tool: Bash
      out: deny
    - in:
        command: rm -rf bin/.pinned
        tool: Bash
      out: deny
