# confidence: 3/3
# dry-run: pass
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve REMOTE-001` を実行する
id: REMOTE-001
kind: example
title: review record は tool_response の回答だけを読み、spec-gate が今作る質問と完全一致する質問の回答（承認/却下/曖昧/自由入力）を判定に変換する。tool_input の回答・preview 不一致・候補なし・AskUserQuestion 以外・回答なしは反映しない
source:
    type: markdown
    ref: docs/spec/harness.md#リモート承認
binding: go run ./tools/bind remote-decisions
examples:
    - in:
        hook:
            tool_input:
                questions:
                    - header: R-1
                      multiSelect: false
                      options:
                        - description: 内容は正しい。このまま仕様として確定する
                          label: 承認
                          preview: P
                        - description: 内容が間違っている。この候補を捨てる
                          label: 却下
                          preview: P
                        - description: 仕様がまだ決まっていない。保留として記録する（理由は Other に書ける）
                          label: 曖昧
                          preview: P
                      question: |-
                        候補 R-1 をどうしますか？

                        P
            tool_name: AskUserQuestion
            tool_response:
                answers:
                    ? |-
                        候補 R-1 をどうしますか？

                        P
                    : 承認
        previews:
            R-1: P
      out:
        - id: R-1
          verdict: approve
