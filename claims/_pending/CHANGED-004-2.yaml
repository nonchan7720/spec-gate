# confidence: 1/3
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve CHANGED-004-2` を実行する
id: CHANGED-004-2
kind: example
title: 変更されたファイルが、claim が触るファイルそのもの、または触るディレクトリの配下なら、その claim は対象
source:
    type: markdown
    ref: docs/spec/harness.md#変更検知の精度
binding: go run ./tools/bind touched
examples:
    - in: '{"touches": ["src/payroll/round.ts"], "changed": "src/payroll/round.ts"}'
      out: true
    - in: '{"touches": ["src/app"], "changed": "src/app/handler/x.ts"}'
      out: true
