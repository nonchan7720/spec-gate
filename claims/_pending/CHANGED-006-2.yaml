id: CHANGED-006-2
kind: example
title: 触るパスと無関係なディレクトリのファイルが変更されても、その claim は対象外
source:
    type: markdown
    ref: docs/spec/harness.md#変更検知の精度
binding: go run ./tools/bind touched
examples:
