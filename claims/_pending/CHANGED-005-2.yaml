# confidence: 1/3
# dry-run: error: binding が失敗 (exit status 1): touched: json: cannot unmarshal string into Go value of type struct { Touches []string "jso
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve CHANGED-005-2` を実行する
id: CHANGED-005-2
kind: example
title: 変更されたファイルが、claim が触るファイルと同じディレクトリにあり拡張子が同じなら対象（拡張子が違えば対象外）
source:
    type: markdown
    ref: docs/spec/harness.md#変更検知の精度
binding: go run ./tools/bind touched
examples:
    - in: '{"touches": ["src/payroll/round.ts"], "changed": "src/payroll/util.ts"}'
      out: true
    - in: '{"touches": ["src/payroll/round.ts"], "changed": "src/payroll/README.md"}'
      out: false
