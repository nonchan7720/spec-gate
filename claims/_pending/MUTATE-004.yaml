# confidence: 2/3
# 承認するには内容を確認して claims/<領域>/ に移し、`spec-gate approve MUTATE-004` を実行する
id: MUTATE-004
kind: example
title: 変異の種類は算術・比較・整数リテラルの一覧で全部とする（各変換の入出力）
source:
    type: markdown
    ref: docs/spec/harness.md#mutation score
binding: go run ./tools/bind mutate
examples:
    - in: a + b
      out:
        - a - b
    - in: a * b
      out:
        - a / b
    - in: x > 0
      out:
        - x >= 0
        - x < 0
    - in: x == y
      out:
        - x != y
    - in: return 100
      out:
        - return 101
    - in: return x
      out: []
