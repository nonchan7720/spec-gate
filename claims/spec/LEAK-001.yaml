id: LEAK-001
kind: example
title: leak の検知関数は、code に現れる対象値（3 桁以上の数値・4 文字以上の文字列）だけを見つかった値として返す
source:
    type: markdown
    ref: docs/spec/harness.md#リテラル漏れ検知
approved:
    by: root
    at: "2026-11-04T16:47:48Z"
    source_hash: sha256:44283c03416376ae469d1a11815158e0767df0aabfb2703c7d37aeb4266be278
binding: go run ./tools/bind leak
examples:
    - in:
        code: if x == 1234.56 { return 1234 }
        values:
            - 1234.56
            - 1234
      out:
        - 1234.56
        - 1234
    - in:
        code: return math.Floor(x)
        values:
            - 1234.56
            - 1234
      out: []
    - in:
        code: return 0
        values:
            - 0
            - 1
      out: []
    - in:
        code: msg := "円未満は切り捨て"
        values:
            - 円未満は切り捨て
            - ok
      out:
        - 円未満は切り捨て
properties:
    - all(output, {# in input.values})
