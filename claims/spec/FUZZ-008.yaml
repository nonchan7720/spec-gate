id: FUZZ-008
kind: example
title: relation 式を、x と f の呼び出し結果（values）を与えて評価し真偽を返す
source:
    type: markdown
    ref: docs/spec/harness.md#ランダム入力による検証
approved:
    by: root
    at: "2026-11-04T16:47:48Z"
    source_hash: sha256:e1321f04a3cdcc102aa0fb6fa68a15b8bfbdf152cff60a652939e854849e28ab
binding: go run ./tools/bind relation
examples:
    - in:
        relation: f(x + 1) == f(x) + 1
        values:
            f(x + 1): 2
            f(x): 1
        x: 1.5
      out: true
    - in:
        relation: f(x + 1) == f(x) + 1
        values:
            f(x + 1): 3
            f(x): 1
        x: 1.5
      out: false
