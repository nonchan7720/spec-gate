id: CHANGED-001
kind: example
title: 変更ファイルが claim の触るファイルそのもの・触るディレクトリの配下・触るファイルと同じディレクトリかつ同じ拡張子のいずれかなら対象（true）、それ以外は対象外（false）
source:
    type: markdown
    ref: docs/spec/harness.md#変更検知の精度
approved:
    by: root
    at: "2026-11-04T16:47:47Z"
    source_hash: sha256:3865b3ed2300c7d1fa6915159dce8e8e38bfae9ed60858a49e73e37c7db5c9f4
binding: go run ./tools/bind touched
examples:
    - in:
        changed: src/payroll/round.ts
        touches:
            - src/payroll/round.ts
      out: true
    - in:
        changed: src/payroll/util.ts
        touches:
            - src/payroll/round.ts
      out: true
    - in:
        changed: src/payroll/README.md
        touches:
            - src/payroll/round.ts
      out: false
    - in:
        changed: src/app/handler/x.ts
        touches:
            - src/app
      out: true
    - in:
        changed: src/ui/List.tsx
        touches:
            - src/payroll/round.ts
      out: false
    - in:
        changed: pkg/domain/relink.go
        touches:
            - tools/bind
            - pkg/domain
      out: true
properties:
    - 'input.changed in input.touches ? output == true : true'
