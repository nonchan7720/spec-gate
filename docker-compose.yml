services:
  neo4j:
    image: neo4j:5.26.32@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
    container_name: spec-gate-neo4j
    ports:
      - "17474:7474" # browser UI
      - "17687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/spec-gate123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - spec-gate-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  spec-gate-data:
