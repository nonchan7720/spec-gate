services:
  neo4j:
    image: neo4j:5.26.32@sha256:42ef3ebfd671ebd01fdebb6dcbe80cf7b45eef2aa3d346ef4132f7ef31e67d2f
    container_name: spec-gate-neo4j
    ports:
      - "17474:7474" # browser UI
      - "17687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/spec-gate123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - spec-gate-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  spec-gate-data:
