name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # re-run after third-party-notices pushes a regenerated file

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: true
          cache: true
      # vet + lint + test + build + third-party notices check + goreleaser config check
      # + spec-gate's own claims and plans (depgraph is not installed here, so the
      # structure claim reports unverified instead of pass)
      - run: mise run ci
